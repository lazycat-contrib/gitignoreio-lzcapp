lzc-sdk-version: "0.1"
name: gitignore.io
package: cloud.lazycat.app.gitignore-io
version: 0.1.0
description: 为你的项目创建必要的 .gitignore 文件
homepage: https://github.com/toptal/gitignore.io
author: toptal
application:
  subdomain: gitignore-io
  background_task: true
  multi_instance: false
  gpu_accel: false
  kvm_accel: false
  usb_accel: false
  public_path:
    - /
  routes:
    - /=http://gitignoreio:8080/
services:
  gitignoreio:
    image: docker.hlmirror.com/guog/gitignore.io:1.0
unsupported_platforms:
  - ios
  - android
  - tvos
